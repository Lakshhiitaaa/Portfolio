<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content />
        <meta name="author" content />
        <title>Modern Business - Start Bootstrap Template</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" th:href="@{/assets/images/favicon.ico}"/>
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link th:href="@{/assets/css/styles.css}" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column">
        <main class="flex-shrink-0">
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
                <div class="container px-5">
                    <span class=" fw-bolder">Portfolio</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
                            <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                            <li class="nav-item"><a class="nav-link" th:href="@{/resume}">Resume</a></li>
                            <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Projects</a></li>
                            <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Page content-->
            <section class="py-5">
    <div class="container px-5">
        <div class="bg-light rounded-4 py-5 px-4 px-md-5">

            <div class="text-center mb-5">
                <h2 class="fw-bolder mb-3 text-gradient">Get in touch</h2>
                <p class="lead fw-normal text-muted mb-0">Let's work together!</p>
            </div>

            <form action="/contact" method="post">

    <div class="form-floating mb-3">
        <input class="form-control" type="text" name="name" placeholder=" " required />
        <label>Full name</label>
    </div>

    <div class="form-floating mb-3">
        <input class="form-control" type="email" name="email" placeholder=" " required />
        <label>Email address</label>
    </div>

    <div class="form-floating mb-3">
        <input class="form-control" type="tel" name="phone" placeholder=" " required />
        <label>Phone number</label>
    </div>

    <div class="form-floating mb-3">
        <textarea class="form-control" name="message" placeholder=" " style="height:150px" required></textarea>
        <label>Message</label>
    </div>

   <div class="d-grid">
    <button type="submit" class="btn btn-primary btn-lg">Submit</button>

    <div th:if="${success}" class="text-center mt-3 p-2 rounded"
         style="color:#22C55E; background:rgba(34,197,94,0.1);">
        Thank you for your response!
    </div>
</div>

</form>

        </div>
    </div>
</section>
        </main>
        <!-- Footer-->
        <footer class="bg-white py-4 mt-auto">
  <div class="container px-5 text-center">
    <a href="/privacy">Privacy</a>
    ·
    <a href="/terms">Terms</a>
    ·
    <a href="/contact">Contact</a>
  </div>
</footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script th:src="@{/assets/js/scripts.js}"></script>
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <!-- * *                               SB Forms JS                               * *-->
        <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
    </body>
</html>
